<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Dashboard</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

    <div class="container">

        <header>

            <h1>NexusWeave</h1>

            <button id="logout">
                Logout
            </button>

        </header>

        <section class="welcome">

            <h2 id="welcomeText">
                Welcome
            </h2>

            <p>
                Here's an overview of your workspace.
            </p>

        </section>

        <section class="stats">

            <div class="card">

                <h3 id="projectCount">
                    0
                </h3>

                <p>Projects</p>

            </div>

            <div class="card">

                <h3 id="taskCount">
                    0
                </h3>

                <p>Tasks</p>

            </div>

            <div class="card">

                <h3 id="doneCount">
                    0
                </h3>

                <p>Completed</p>

            </div>

        </section>

        <section>

            <div class="title">

                <h2>Projects</h2>

                <button id="newProject">
                    + New Project
                </button>

            </div>

            <div id="projects">

            </div>

        </section>

    </div>

    <script src="js/dashboard.js"></script>

</body>

</html>
