<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Mode | NexusWeave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/product.css" />
  <link rel="stylesheet" href="../styles/dashboard.css" />
  <link rel="stylesheet" href="../styles/sidebar.css" />
  <link rel="stylesheet" href="../styles/realtime.css" />
  <link rel="stylesheet" href="../styles/ai.css" />
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark"></div>
        <div>
          <p class="eyebrow">Focus suite</p>
          <h2>NexusWeave</h2>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Primary navigation">
        <a class="nav-item" href="dashboard.html">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          </span>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" href="create.html">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v8"></path><path d="M8 12h8"></path></svg>
          </span>
          <span>Create</span>
        </a>
        <a class="nav-item" href="tasks.html">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          </span>
          <span>Tasks</span>
        </a>

        <a class="nav-item" href="board.html">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M8 7v10"></path><path d="M12 7v6"></path><path d="M16 7v4"></path></svg>
          </span>
          <span>Board</span>
        </a>
        <a class="nav-item" href="reports.html">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M7 14l3-3 2 2 5-6"></path></svg>
          </span>
          <span>Reports</span>
        </a>
        <a class="nav-item" href="org.html">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </span>
          <span>Organization</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="profile-menu-wrapper">
          <button class="profile-trigger" type="button" data-profile-menu-trigger aria-haspopup="menu" aria-expanded="false">
            <span class="profile-avatar" data-profile-avatar>NW</span>
            <span class="profile-meta">
              <strong data-profile-name>Profile</strong>
              <small data-profile-email>workspace</small>
            </span>
          </button>
          <div class="profile-menu" data-profile-menu role="menu">
            <button class="profile-menu-item" type="button" data-profile-action="change-photo">Change photo</button>
            <button class="profile-menu-item" type="button" data-profile-action="copy-link">Copy link</button>
            <button class="profile-menu-item" type="button" data-profile-action="settings">Settings</button>
            <button class="profile-menu-item danger" type="button" data-profile-action="logout">Logout</button>
          </div>
        </div>
      </div>
    </aside>

    <div class="content-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Deep work</p>
          <h1>Focus Mode</h1>
        </div>
        <div class="header-actions">
          <button class="theme-toggle-btn" type="button" data-theme-toggle aria-label="Toggle dark mode">
            <span class="toggle-icon"></span>
            <span>Theme</span>
          </button>
        </div>
      </header>

      <main class="page-main">
        <section class="focus-card">
          <div class="focus-intro">
            <p class="eyebrow">Pomodoro session</p>
            <h2>Stay present and keep the next block moving.</h2>
            <p class="text-soft">A calm, focused timer for one uninterrupted work sprint.</p>
          </div>

          <div class="focus-timer-card">
            <div class="focus-timer" id="timerDisplay">25:00</div>
            <div style="margin: 0.5rem 0 1rem 0; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
              <span class="meta" style="color: var(--text-soft); font-size: 0.9rem;">Duration:</span>
              <input id="customMinutes" type="number" min="1" max="180" value="25" style="width: 75px; text-align: center; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 0.4rem 0.6rem; color: inherit; font-weight: 600;" />
              <span class="meta" style="color: var(--text-soft); font-size: 0.9rem;">minutes</span>
            </div>
            <p id="timerStatus" class="focus-status">Ready to focus</p>
            <div class="focus-actions">
              <button id="startTimer" class="primary-btn" type="button">Start</button>
              <button id="pauseTimer" class="ghost-btn" type="button">Pause</button>
              <button id="resetTimer" class="ghost-btn" type="button">Reset</button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../scripts/services/api-client.js"></script>
  <script src="../scripts/services/socket-service.js"></script>
  <script src="../scripts/services/productivity-tracker.js"></script>
  <script src="../scripts/services/ai-service.js"></script>
  <script src="../scripts/shared/ai-assistant.js"></script>
  <script src="../scripts/shared/notification-system.js"></script>
  <script src="../scripts/shared/chat-widget.js"></script>
  <script src="../scripts/shared/theme.js"></script>
  <script src="../scripts/shared/profile-menu.js"></script>
  <script src="../scripts/focus/focus.js"></script>
</body>
</html>
