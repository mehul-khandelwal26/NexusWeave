<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PORNHUB</title>


    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="landing">

    <nav class="navbar">

        <div class="logo">

            <div class="logo-box"></div>

            <span>PORNHUB</span>

        </div>



    </nav>

    <section class="hero">
        <h1>
            MEHUL.<br>
            ARUSH.
        </h1>

        <p class="subtitle">
            MADE COMPLETELY BY MEHUL ARUSH.
        </p>

        <!-- Login Card -->

        <div class="login-card">

            <h2>Welcome Back</h2>

            <p>
                Log in to your workspace
            </p>

            <form id="loginForm">

                <div class="input-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com">

                </div>

                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••">

                </div>

                <button
                    class="login-btn"
                    type="submit">

                    Login

                </button>

                <button
                    class="google-btn"
                    type="button">

                    Continue with Google

                </button>

            </form>

            <div class="switch">

                Don't have an account?

                <a href="#">Sign Up</a>

            </div>

        </div>

    </section>

</div>

<script src="js/auth.js"></script>

</body>
</html>
